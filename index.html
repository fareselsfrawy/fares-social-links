<!DOCTYPE html>

<style>
:root{--bg:#080910;--text:#f7f7ff;--muted:#a9aec4;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;color:var(--text);font-family:Arial,Tahoma,sans-serif;background:radial-gradient(ellipse at 12% 15%,rgba(0,229,255,.15),transparent 35%),radial-gradient(ellipse at 88% 25%,rgba(155,92,255,.22),transparent 36%),radial-gradient(ellipse at 50% 100%,rgba(255,0,153,.11),transparent 40%),var(--bg)}
.orb{position:fixed;width:220px;height:220px;border-radius:50%;filter:blur(85px);opacity:.2;pointer-events:none}.one{top:8%;left:-100px;background:#00e5ff}.two{bottom:4%;right:-100px;background:#9b5cff}
.wrap{width:min(100%,450px);position:relative}
.card{padding:32px 24px 25px;border:1px solid var(--line);border-radius:28px;background:rgba(20,22,38,.8);backdrop-filter:blur(18px);box-shadow:0 24px 80px #0008;text-align:center}
.photo-ring{width:132px;height:132px;padding:3px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,#00e5ff,#9b5cff 55%,#ff4da6);box-shadow:0 0 32px #9b5cff55}
.photo{width:100%;height:100%;display:block;object-fit:cover;object-position:center 25%;border-radius:50%;border:3px solid #111322}
h1{font-size:27px;margin:0 0 8px;letter-spacing:.2px}
.tag{color:var(--muted);font-size:14px;line-height:1.8;margin:0 auto 25px}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:13px 15px;text-decoration:none;color:var(--text);text-align:right;border:1px solid var(--line);border-radius:16px;background:#ffffff08;transition:.2s}
.link:hover{transform:translateY(-3px);border-color:#a36affaa;background:#9b5cff18;box-shadow:0 8px 28px #0003}
.icon{width:46px;height:46px;flex:0 0 46px;border-radius:14px;display:grid;place-items:center;color:white}
.icon svg{width:25px;height:25px;fill:currentColor}
.fb{background:#1877f2}.ig{background:linear-gradient(135deg,#7938d8,#e1306c,#ffb347)}
.label{flex:1}.label strong{display:block;font-size:15px;margin-bottom:4px}.label small{font-size:12px;color:var(--muted)}
.arrow{font-size:23px;color:#9ba0b8}
footer{font-size:11px;color:#737991;margin-top:19px}
@media(max-width:380px){.card{padding:26px 16px 20px}h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
